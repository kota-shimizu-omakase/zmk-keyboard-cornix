# Debounce: 3 ms press and release on both halves (board defaults are
# 5 ms left, 3 ms right; the factory RMK used 20 ms, which added latency).
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# Deep sleep after 30 minutes without input (never while on USB power).
# Any key wakes the half; the waking key press itself is not sent.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# +8 dBm on both halves (the right half defaulted to 0 dBm), fewer
# retransmissions on the split link.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

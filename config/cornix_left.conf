# Ask the Mac for a fixed 15 ms connection interval. Apple's accessory
# guidelines reject 7.5-15 ms requests (min must be >= 15 ms), in which
# case macOS keeps its own choice.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Stock-layout build: standard split (left central, right peripheral) plus a
# settings reset. Dongle targets from upstream dropped.
---
include:
  - board: cornix_left//zmk
    artifact-name: cornix_left_default_nosd

  - board: cornix_right//zmk
    artifact-name: cornix_right_nosd

  - board: cornix_right//zmk
    shield: settings_reset
    snippet: studio-rpc-usb-uart nrf52840-nosd
    artifact-name: cornix_reset
